<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f6feb">
<title>Set your password · Garage Daily Log</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,Arial,sans-serif}
body{margin:0;background:#f4f6f9;color:#1c2430}
main{max-width:440px;margin:48px auto;padding:20px}
.card{background:#fff;border:1px solid #d9dee6;border-radius:12px;padding:24px}
h1{font-size:24px;margin:0 0 12px}p{margin:0 0 16px}
label{display:block;margin:16px 0 6px}
input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #d9dee6;border-radius:8px}
button{margin-top:20px;background:#1f6feb;color:#fff;border-color:#1f6feb;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}a{color:#1f6feb}
[hidden]{display:none!important}
#message{margin-top:16px}#message.error{color:#b42318}
@media(prefers-color-scheme:dark){body{background:#12161c;color:#e8edf3}.card{background:#1b222c;border-color:#2c3644}input{background:#12161c;color:#e8edf3;border-color:#2c3644}a{color:#7eb4ff}#message.error{color:#ff9b92}}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Set your password</h1>
    <p id="intro">Checking your account link…</p>
    <form id="password-form" hidden>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
      <button id="save-password" type="submit">Save password</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <a id="open-app" href="index.html" hidden>Open Garage Daily Log</a>
  </div>
</main>
<script type="module" src="account.js"></script>
</body>
</html>
